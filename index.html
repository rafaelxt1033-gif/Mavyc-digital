<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mavyc PDV - Frente de Caixa</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primaria: #ea580c; 
            --secundaria: #334155; 
            --sucesso: #16a34a; 
            --alerta: #eab308; 
            --erro: #dc2626; 
            --fundo: #f8fafc; 
            --texto: #0f172a; 
            --fiscal: #4f46e5; 
            --whatsapp: #25D366;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--fundo); color: var(--texto); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        .tela { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; flex-direction: column; }
        .tela.ativa { display: flex; }
        
        .login-wrapper { background: linear-gradient(135deg, #1e293b, #0f172a); justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; border-top: 6px solid var(--primaria); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #475569; font-size: 14px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; }
        .btn-universal { width: 100%; padding: 15px; background: var(--primaria); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-universal:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .top-bar { background: var(--secundaria); color: white; padding: 0 25px; height: 65px; display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 4px solid var(--primaria); }
        .pdv-container { display: flex; width: 100%; height: calc(100% - 65px); background: white; }
        .cupom-area { width: 45%; background: white; padding: 30px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .cupom-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; font-weight: 600; padding-bottom: 12px; border-bottom: 2px solid var(--secundaria); font-size: 14px; }
        .produtos-lista { flex-grow: 1; overflow-y: auto; margin-top: 10px; }
        .item-cupom { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; font-size: 15px; align-items: center; }
        
        .total-box { background: #ffffff; color: var(--primaria); padding: 25px; border-radius: 12px; text-align: center; margin-top: 20px; border: 4px solid var(--primaria); box-shadow: 0 4px 15px rgba(234, 88, 12, 0.15); }
        .total-box h3 { font-size: 16px; letter-spacing: 1px; margin-bottom: 5px; font-weight: 800; color: var(--secundaria); }
        .total-box p { font-size: 42px; font-weight: 900; }
        
        .operacao-area { width: 55%; padding: 30px; display: flex; flex-direction: column; background: #f8fafc; justify-content: space-between; }
        .terminal-log { background: #0f172a; color: #38bdf8; padding: 15px; border-radius: 8px; height: 110px; overflow-y: auto; font-family: monospace; font-size: 13px; margin-bottom: 15px; border-left: 4px solid var(--alerta); }
        .area-balanca { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; border: 1px solid #cbd5e1; }
        .area-balanca input { padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; }
        .input-codigo { width: 100%; padding: 22px; font-size: 38px; text-align: center; border: 3px solid var(--primaria); border-radius: 12px; outline: none; font-weight: bold; }
        
        .fechamento-painel { background: var(--secundaria); padding: 25px; border-radius: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border-bottom: 6px solid var(--primaria); }
        .fechamento-painel label { font-size: 17px !important; font-weight: 900 !important; text-transform: uppercase; letter-spacing: 1.5px; display: block; margin-bottom: 8px; color: white; }
        .fechamento-painel input, .fechamento-painel select { background: #1e293b !important; color: #ffffff !important; border: 3px solid #64748b !important; font-size: 28px !important; font-weight: 900 !important; padding: 16px !important; border-radius: 10px !important; }
        .fechamento-painel input:focus, .fechamento-painel select:focus { border-color: var(--primaria) !important; }
        #box-troco { color: #38bdf8 !important; font-size: 36px !important; text-shadow: 0 2px 8px rgba(0,0,0,0.8); font-weight: 900; }
        
        .dashboard-area { padding: 30px; background: #f1f5f9; width: 100%; height: calc(100% - 65px); overflow-y: auto; }
    </style>
</head>
<body>
    <div id="tela-login" class="tela ativa login-wrapper">
        <div class="login-box">
            <h2 style="color: var(--primaria); margin-bottom: 5px;">Mavyc PDV</h2>
            <div class="input-group"><label>Usuário</label><input type="text" id="login-usuario"></div>
            <div class="input-group"><label>Senha</label><input type="password" id="login-senha" onkeypress="if(event.key === 'Enter') fazerLogin()"></div>
            <button class="btn-universal" onclick="fazerLogin()">Acessar PDV</button>
        </div>
    </div>

    <div id="tela-pdv" class="tela">
        <div class="top-bar">
            <div><strong>CAIXA 01</strong> | Operador: <span id="caixa-nome-status">Padrão</span></div>
            <div style="display: flex; gap: 8px;">
                <button class="btn-universal" onclick="mostrarTela('tela-adm')" style="background: var(--alerta); color: #333; padding: 8px; width: auto;">Painel ADM</button>
                <button class="btn-universal" onclick="sair()" style="background: #0f172a; padding: 8px; width: auto;">Sair</button>
            </div>
        </div>
        <div class="pdv-container">
            <div class="cupom-area">
                <div class="produtos-lista" id="lista-cupom"></div>
                <div class="total-box"><h3>TOTAL A PAGAR</h3><p>R$ <span id="valor-total">0.00</span></p></div>
            </div>
            <div class="operacao-area">
                <div class="terminal-log" id="log-sistema"><div>[SISTEMA MAVYC] Terminal pronto. Módulo Vercel Proxy Ativo.</div></div>
                
                <div style="position: relative; display: flex; gap: 8px;">
                    <input type="number" id="input-qtd-manual" value="1" style="width: 80px; text-align: center; font-size: 24px; border: 3px solid var(--secundaria); border-radius: 12px; font-weight: bold;">
                    <div style="position: relative; flex: 1;">
                        <input type="text" class="input-codigo" id="codigo-barras" placeholder="Bipe ou digite o código..." onkeydown="navegarSugestoes(event)" autocomplete="off">
                    </div>
                </div>
                
                <div class="fechamento-painel">
                    <div class="input-group" style="margin: 0;">
                        <label class="label-pagamento">Forma de Pagamento (F3)</label>
                        <select id="forma-pagamento"><option>Dinheiro</option><option>PIX</option><option>Cartão</option></select>
                    </div>
                    <div class="input-group" style="margin: 0;">
                        <label class="label-recebido">Valor Recebido (R$)</label>
                        <input type="number" id="valor-pago" placeholder="0.00" oninput="calcularTroco()">
                    </div>
                    <div style="grid-column: span 2; text-align:right; font-weight:bold;" id="box-troco">Troco: R$ 0.00</div>
                    <button class="btn-universal" onclick="finalizarVenda(false)" style="background: var(--sucesso);">FINALIZAR PEDIDO (F2)</button>
                </div>
            </div>
        </div>
    </div>

    <div id="tela-adm" class="tela">
        <div class="top-bar">
            <div><strong>PAINEL GERENCIAL</strong></div>
            <button class="btn-universal" onclick="mostrarTela('tela-pdv')" style="background: var(--primaria); width: auto; padding: 8px 15px;">Voltar ao Caixa</button>
        </div>
        <div class="dashboard-area">
            <div style="background: white; padding: 25px; border-radius: 8px; border-left: 5px solid var(--fiscal);">
                <h3>☁️ Sincronização Mavyc (Segurança Vercel Ativa)</h3>
                <p style="color: #64748b; font-size: 14px; margin-bottom: 15px;">O Token do GitHub foi ocultado. Digite apenas o repositório.</p>
                
                <div class="input-group">
                    <label>Repositório GitHub (Ex: seunome/pdv-cliente)</label>
                    <input type="text" id="cloud-repo" placeholder="usuario/repositorio">
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button onclick="salvarConfiguracaoNuvem()" class="btn-universal" style="background: var(--fiscal);">Salvar Repositório</button>
                    <button onclick="forcarSincronizacaoNuvem()" class="btn-universal" style="background: var(--sucesso);">⚡ Forçar Sync Seguro</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let estoqueCloud = {}; let vendasRealizadas = []; let cupomAtual = []; let totalVenda = 0;
        
        window.onload = async function() {
            document.getElementById('cloud-repo').value = localStorage.getItem('cloud_repo') || '';
            const vendasSalvas = localStorage.getItem('vendas_realizadas');
            if (vendasSalvas) vendasRealizadas = JSON.parse(vendasSalvas);
            await carregarEstoqueCompletoDaNuvem();
        };

        async function carregarEstoqueCompletoDaNuvem() {
            let repo = localStorage.getItem('cloud_repo');
            if(repo) {
                try {
                    let res = await fetch(`https://raw.githubusercontent.com/${repo}/main/precos.json`);
                    if (res.ok) { estoqueCloud = await res.json(); localStorage.setItem('estoque_mercado', JSON.stringify(estoqueCloud)); return; }
                } catch(e) {}
            }
            estoqueCloud = {"789123456001": {"nome": "PRODUTO TESTE", "preco": 10.00}}; localStorage.setItem('estoque_mercado', JSON.stringify(estoqueCloud));
        }

        function mostrarTela(id) { document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa')); document.getElementById(id).classList.add('ativa'); }

        function fazerLogin() {
            const u = document.getElementById('login-usuario').value; const s = document.getElementById('login-senha').value;
            if (u === 'joao' && s === 'admin123') mostrarTela('tela-pdv');
        }
        function sair() { mostrarTela('tela-login'); }

        function navegarSugestoes(e) {
            if(e.key === 'Enter') {
                let txt = document.getElementById('codigo-barras').value; let qtd = document.getElementById('input-qtd-manual').value || 1;
                if(estoqueCloud[txt]) { addCupom(txt, qtd); }
            }
        }

        function addCupom(cod, qtd) {
            const p = estoqueCloud[cod]; cupomAtual.push({ cod: cod, nome: p.nome, qtd: qtd, unit: p.preco, total: p.preco * qtd });
            document.getElementById('codigo-barras').value = ''; renderizarCupom();
        }

        function renderizarCupom() {
            const lista = document.getElementById('lista-cupom'); lista.innerHTML = ''; totalVenda = 0;
            cupomAtual.forEach((item, i) => { totalVenda += item.total; lista.innerHTML += `<div class="item-cupom"><span>${item.nome}</span><span>${item.total.toFixed(2)}</span></div>`; });
            document.getElementById('valor-total').innerText = totalVenda.toFixed(2); calcularTroco();
        }

        function calcularTroco() {
            const pago = parseFloat(document.getElementById('valor-pago').value || 0);
            document.getElementById('box-troco').innerText = `Troco: R$ ${(pago >= totalVenda ? pago - totalVenda : 0).toFixed(2)}`;
        }

        function finalizarVenda(nfce) {
            vendasRealizadas.push({ data: new Date().toLocaleString(), total: totalVenda });
            localStorage.setItem('vendas_realizadas', JSON.stringify(vendasRealizadas));
            cupomAtual = []; totalVenda = 0; renderizarCupom();
        }

        function logTerminal(msg) {
            const log = document.getElementById('log-sistema');
            log.innerHTML += `<div>> ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function forcarSincronizacaoNuvem() {
            let repo = localStorage.getItem('cloud_repo'); 
            if (!repo) { alert("Configure o repositório no Painel ADM."); return; }

            logTerminal("Iniciando sync seguro com Vercel Proxy...");
            
            try {
                let bodyPayload = { 
                    repo: repo,
                    message: "Sincronização Segura PDV Mavyc", 
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(estoqueCloud))))
                };

                let res = await fetch('/api/sync', { 
                    method: "PUT", 
                    headers: { "Content-Type": "application/json" }, 
                    body: JSON.stringify(bodyPayload) 
                });

                if(res.ok) {
                    alert("✅ Backup na nuvem realizado com segurança!");
                    logTerminal("Sync concluído com sucesso.");
                } else {
                    let err = await res.json();
                    alert("❌ Erro de sincronização: " + (err.error || "Desconhecido"));
                    logTerminal("Erro no Proxy Vercel.");
                }
            } catch(err) { 
                alert("❌ Falha de conexão. O PDV operará offline."); 
                logTerminal("Falha de conexão com a API.");
            }
        }

        function salvarConfiguracaoNuvem() { 
            localStorage.setItem('cloud_repo', document.getElementById('cloud-repo').value); 
            alert("Repositório salvo!");
        }
    </script>
</body>
</html>
